name: Audit

on:
  workflow_dispatch: {}
  push:
    paths:
      - yarn.lock
  pull_request:
    paths:
      - yarn.lock

permissions:
  contents: read

env:
  NODE_VERSION: '22'

concurrency:
  group: 'audit'
  cancel-in-progress: true

jobs:
  audit:
    name: Run audit
    runs-on: ubuntu-latest
    steps:
    # Setup
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.ref }}
    - name: Enable Yarn 4.x
      run: corepack enable
    - name: Setup NodeJS ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'yarn'
    - name: Install packages
      run: yarn install --immutable
    # Run the actual audit
    - name: Audit
      run: |
        yarn npm audit --recursive --severity moderate --json > audit_result.json || true
    - name: Format results
      # NOTE: The unholy sausage in the third line essentially uses jq to
      # condense the most important info into a human-readable txt file. This is
      # merely meant as a canary; the maintainers should absolutely run the
      # command locally once informed to get all information if necessary.
      run: |
        jq --slurp '.' audit_result.json > tmp.json
        mv tmp.json audit_result.json
        echo "count=$(jq length audit_result.json)" >> $GITHUB_ENV
        jq -r '.[] | .value as $v | .children += { package: $v } | .children | ("Package: \(.package)", "  Version(s) \(."Vulnerable Versions")", "  \(.Issue) (Severity: \(.Severity))", "  URL: \(.URL)")' audit_result.json > audit_result.txt
    - name: Report results
      # NOTE: Truncates the content to at most 1,500 characters to avoid
      # Discord's character limit.
      env:
        WEBHOOK: ${{ secrets.DISCORD_AUDIT_WEBHOOK }}
      run: |
        AUDIT_CONTENT=$(<audit_result.txt)
        [ -n "$WEBHOOK" ] && curl -d "$(jq -n \
          --arg count '${{ env.count }}' \
          --arg chars "${#AUDIT_CONTENT}" \
          --arg url 'https://github.com/Zettlr/Zettlr/actions/runs/${{ github.run_id }}' \
          '{content: (
            "## Repository Audit Results\n\n" +
            "A new audit has been run against Zettlr\u2019s `yarn.lock` file. This happens automatically if dependencies have changed, or if a maintainer has manually requested an audit. There have been **\($count) results**.\n\n" +
            "For the full results (\($chars) characters), please see the summary of the run: \($url).\n\n" +
            "**Disclaimer**: Many results are not relevant for the app\u2019s security, and the pure number of results cannot be used to infer whether there exists a security risk for Zettlr and its users. The maintainers are able to infer whether a result indicates a critical issue that needs fixing."
          )}')" -H "Content-Type: application/json" -X POST "$WEBHOOK"
        jq -rn \
          --arg chars "${#AUDIT_CONTENT}" \
          --rawfile audit audit_result.txt \
          '(
            "## Full Audit results\n\n" +
            "Below follow the full results from the audit report (\($chars) characters).\n\n" +
            "~~~\n" +
            $audit +
            "\n~~~\n\n" +
            "End of audit."
          )' >> "$GITHUB_STEP_SUMMARY"
